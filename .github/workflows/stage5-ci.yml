name: ECS170 Stage 5 sparse GCN checks
on:
  push:
    paths:
      - "script/stage5/**"
      - "script/stage_5_script/**"
      - "local_code/stage_5_code/**"
      - "tests/test_stage5.py"
      - "tests/test_teacher_template_stage5.py"
      - "requirements-stage5.txt"
      - ".github/workflows/stage5-ci.yml"
  pull_request:
    paths:
      - "script/stage5/**"
      - "script/stage_5_script/**"
      - "local_code/stage_5_code/**"
      - "tests/test_stage5.py"
      - "tests/test_teacher_template_stage5.py"
      - "requirements-stage5.txt"
      - ".github/workflows/stage5-ci.yml"
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile GCN source and tests
        run: python -m compileall -q script/stage5 script/stage_5_script local_code/stage_5_code tests/test_stage5.py tests/test_teacher_template_stage5.py
  offline:
    needs: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CPU PyTorch installation
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install lightweight GCN test dependencies
        run: python -m pip install numpy scikit-learn matplotlib
      - name: Verify sparse GCN, split validation and report outputs
        run: python -m unittest discover -s tests -p "test_stage5.py" -v
      - name: Verify instructor base-class integration
        run: python -m unittest discover -s tests -p "test_teacher_template_stage5.py" -v
